<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRP - living COVER</title>
    <!-- Google Font: Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">

    <style>
        .orbL {
            font-family: 'Lexend', sans-serif !important;
            border: 1px solid #000000;
            border-radius: 5px;
            background: #ffffff;
            width: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }
        .abc-bar {
            background: #00cc98;
            display: flex;
            flex-wrap: wrap;
            margin: 0 !important;
            padding: 0 !important;
            list-style: none;
            border-bottom: 3px solid #000000; /* Schwarzer Abstand unten nach A-Z */
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .abc-tab {
            flex: 1 1 auto;
            height: 48px; /* Höhere Tabs für einen fetteren, sauberen Look */
            text-align: center;
            font-size: 16px;
            border-right: 1px solid #d6d6d6;
            display: inline-block;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        .abc-tab:last-child {
            border-right: none;
        }
        .abc-tab a {
            display: block;
            line-height: 48px; /* Zentriert die Buchstaben perfekt in der neuen Höhe */
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .abc-tab:hover {
            background: #000000;
        }
        .abc-tab:hover a {
            color: #ffffff;
        }
        /* Hochformat 9:16 (177.78%) */
        .video-content-area {
            position: relative;
            width: 100% !important;
            padding-bottom: 177.78%;
            background: #000000;
            overflow: hidden;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        .start-cover, .video-content-area iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
        .start-cover {
            object-fit: cover !important;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="orbL">
    <!-- Alphabet Leiste ohne Überschrift, mit vergrößerten Tabs und Abschluss -->

<script>
    function loadVideo(videoId) {
        var container = document.getElementById('player-container');
        container.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&origin=' + window.location.origin + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
