    <style>
        .orbL {
            font-family: 'Lexend', sans-serif !important;
            border: 1px solid #000000;
            border-radius: 5px;
            background: #ffffff;
            width: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }
        .orbLt {
            padding-left: 10px;
            line-height: 50px;
            height: 50px;
            background-color: #000000;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box !important;
        }
        .abc-bar {
            background: #00cc98;
            display: flex;
            flex-wrap: wrap;
            margin: 0 !important;
            padding: 0 !important;
            list-style: none;
            border-bottom: 1px solid #d6d6d6;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        .abc-tab {
            flex: 1 1 auto;
            height: 32px;
            text-align: center;
            font-size: 11px;
            border-right: 1px solid #d6d6d6;
            display: inline-block;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        .abc-tab:last-child {
            border-right: none;
        }
        .abc-tab a {
            display: block;
            line-height: 32px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .abc-tab:hover {
            background: #000000;
        }
        .abc-tab:hover a {
            color: #ffffff;
        }
        .video-content-area {
            position: relative;
            width: 100% !important;
            padding-bottom: 56.25%;
            background: #000000;
            overflow: hidden;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        .start-cover, .video-content-area iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
        .start-cover {
            object-fit: cover !important;
            display: block;
            cursor: pointer;
        }
    </style>
